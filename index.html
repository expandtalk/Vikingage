          "name": "Viking Age",
          "inLanguage": ["sv", "en"],
          "publisher": { "@id": "https://vikingage.se/#org" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": { "@type": "EntryPoint", "urlTemplate": "https://vikingage.se/?q={search_term_string}" },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
