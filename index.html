    <!-- Strukturerad data (schema.org, JSON-LD) — sajt-nivå. Statisk i <head> så AI/sökmotorer ser
         den UTAN JS (GEO: "No JSON-LD found"). Org + WebSite med SearchAction (/?q= öppnar söket). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://vikingage.se/#org",
          "name": "Viking Age",
          "url": "https://vikingage.se/",
          "description": "Källkritisk forskningsplattform för skandinaviska runinskrifter, ortnamn, medeltidsbrev och vikingatida arkeologi."
        },
        {
          "@type": "WebSite",
          "@id": "https://vikingage.se/#website",
          "url": "https://vikingage.se/",
          "name": "Viking Age",
          "inLanguage": ["sv", "en"],
          "publisher": { "@id": "https://vikingage.se/#org" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": { "@type": "EntryPoint", "urlTemplate": "https://vikingage.se/?q={search_term_string}" },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
